name: GitHub Actions Demo

on:
  workflow_dispatch:

jobs:
  Explore-GitHub-Actions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python job.py
      - name: Creer un fichier
        run: echo "Fichier genere par la pipeline" > resultat.txt
      - name: Sauvegarder le fichier
        uses: actions/upload-artifact@v4
        with:
          name: resultat-pipeline
          path: resultat.txt